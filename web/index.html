<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f0f0f5">
<title>Wallet Card – Gift Stickers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="bar">
    <button class="icon-btn" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>Wallet</h1>
    <div class="bar-right">
      <button class="icon-btn" aria-label="Scan">
        <svg viewBox="0 0 24 24"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3M4 12h16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" aria-label="More">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="page" id="page">

    <section class="stage" id="stage">
      <div class="scene" id="scene">
        <div class="card" id="card">
          <!-- thickness (a few layers behind the face) -->
          <div class="edge e3"></div><div class="edge e2"></div><div class="edge e1"></div>
          <div class="face" id="face">
            <canvas id="gl"></canvas>
            <canvas id="pat" class="pat"></canvas>

            <div class="content" id="content">
              <div class="balance">
                <svg class="gem" viewBox="0 0 64 64" aria-hidden="true">
                  <defs>
                    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="var(--gem2, #bfeaff)"/></linearGradient>
                    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gem1, #e9f8ff)"/><stop offset="1" stop-color="var(--gem3, #7cc8f0)"/></linearGradient>
                  </defs>
                  <path d="M14 8h36l12 14-30 36L2 22z" fill="url(#gB)"/>
                  <path d="M14 8 24 22h16L50 8z" fill="url(#gA)" opacity=".95"/>
                  <path d="M2 22h22L32 58zM62 22H40L32 58z" fill="#fff" opacity=".28"/>
                  <path d="M24 22 32 58 40 22z" fill="#fff" opacity=".12"/>
                  <path class="sparkle" d="M47 6l1.6 4.2L53 12l-4.4 1.8L47 18l-1.6-4.2L41 12l4.4-1.8z" fill="#fff"/>
                </svg>
                <span class="amount">11</span><span class="unit">GRAM</span>
              </div>
              <div class="usd">$33.00</div>
              <div class="holder" id="holder">CONCEPT</div>
              <div class="chip" id="chip" aria-label="QR">
                <svg viewBox="0 0 32 32"><g fill="none" stroke="#6f7478" stroke-width="2.6" stroke-linejoin="round"><rect x="5" y="5" width="8.4" height="8.4" rx="2"/><rect x="18.6" y="5" width="8.4" height="8.4" rx="2"/><rect x="5" y="18.6" width="8.4" height="8.4" rx="2"/></g><g fill="#6f7478"><rect x="19" y="19" width="3.4" height="3.4" rx=".7"/><rect x="24" y="19" width="3.4" height="3.4" rx=".7"/><rect x="19" y="24" width="3.4" height="3.4" rx=".7"/><rect x="24" y="24" width="3.4" height="3.4" rx=".7"/></g></svg>
              </div>
              <div class="engrave" id="engrave"><span></span><span></span></div>
            </div>

            <div class="stickers" id="stickers"></div>
            <div class="fx" id="fx"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="pill" id="btnAdd">Add Funds</button>
      <button class="pill" id="btnSend">Send</button>
    </div>

    <p class="hint" id="hint">Hold a gift for its menu, or drag it onto the card: it stays exactly where you drop it. Tap a sticker on the card to select it, then drag the handles to resize and rotate.</p>

    <h2 class="section">Your collectibles</h2>
    <div class="grid" id="grid"></div>
    
  </main>

  <div class="menu" id="menu" hidden></div>
  <div class="bin" id="bin" aria-hidden="true">
    <svg viewBox="0 0 48 48"><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><g class="lid"><path d="M8 13h32"/><path d="M19 13V9h10v4"/></g><path d="M12 17l2 24h20l2-24"/><path d="M20 23v12M28 23v12"/></g></svg><span>Remove</span>
  </div>
  <div class="drag-hint" id="dragHint">Drag this collectible here</div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="gifts-data.js"></script>
<script src="app.js"></script>
</body>
</html>
